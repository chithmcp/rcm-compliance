
<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <div class="login-box">

            <h1>Skanda Info Solutions</h1>

            <p class="subtitle">
                Login to your account
            </p>


            <!-- Error message -->

            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <!-- Login Form -->

            <form method="POST"
                  action="{{ url_for('login') }}">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <!-- Register link -->

            <p class="bottom-text">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</body>

</html>
